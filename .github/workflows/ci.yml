name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Tests (unit, integration, regression, app smoke test)
        run: pytest
      - name: Smoke test - CLI end to end in demo mode
        run: executive-report --provider offline
      - name: Smoke test - evaluation harness
        run: python scripts/run_eval.py --provider offline --min-pass-rate 100
